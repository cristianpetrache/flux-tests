---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-1-tenant
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./kubernetes/fluxcd/repositories/tenants/dev-cluster/app-1
  prune: true
  sourceRef:
    kind: GitRepository
    name: app-1
  timeout: 3m0s
  wait: true  
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-1
  namespace: flux-system
spec:
  dependsOn:
    - name: app-1-tenant
  interval: 5m0s
  path: ./apps/app-1/deploy
  prune: true
  sourceRef:
    kind: GitRepository
    name: app-1
  timeout: 3m0s
  wait: true
